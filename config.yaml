# RegLens configuration. Model IDs and prices live here only — never hard-code them.

# subscription: local development runs on a Claude subscription (Claude Code / `claude -p`);
#               tokens are the real measure, EUR is an API-equivalent yardstick only.
# api:          calls billed per token (e.g. the bring-your-own-key public demo).
billing: subscription

models:
  tiers:
    bulk: claude-haiku-5-5       # cheap bulk tasks (classification, short summaries)
    dev: claude-sonnet-5-5       # development, agent iteration, smoke evals
    milestone: claude-opus-5-5   # milestone evals, one-off extraction — state a reason
  default_tier: dev

# USD per million tokens, Anthropic list prices as of 2026-10-26.
pricing:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01             # ASSUMED 10% of input — verify on the pricing page
    long_context:                # prompts above the threshold are billed at higher rates
      threshold_tokens: 100000
      input: 0.50
      output: 2.50
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20

pricing_rules:
  cache_write_multiplier: 1.25   # cache writes vs. base input price — verify
  batch_discount: 0.5            # Message Batches API

# EUR figures are API-equivalent under `billing: subscription`.
budget:
  usd_to_eur: 0.90               # update manually now and then
  target_eur: 150
  ceiling_eur: 250
  approval_threshold_eur: 2      # ask before any single run above this (billing: api)
  approval_threshold_tokens: 1000000  # ask before any single run above this (billing: subscription)
  current_phase: 3
  phases_eur:                    # allocations from docs/ROADMAP.md
    0: 5
    1: 10
    2: 40
    3: 45
    4: 40
    5: 10

answer:
  tier: dev                      # model tier for answering
  effort: medium                 # claude -p effort level
  k: 8                           # retrieved chunks given to the model
  abstain_below: 0.05            # skip the LLM call if the best rerank score is below this

agent:
  max_calls: 10                  # tool calls per question (enforced by the MCP server)
  max_budget_usd: 0.75           # claude -p hard cap per question (CLI's own cost estimate)
  max_turns: 13                  # API loop: model calls per question (hard stop)
  max_tokens_per_question: 200000  # API loop: stop and answer once this many tokens are used

tokens:
  chars_per_token: 3.01          # calibrated 2026-10-27 on CRR text, claude-haiku-5-5

ledger_path: data/ledger.jsonl
