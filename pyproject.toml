[project]
name = "reglens"
version = "0.1.0"
description = "Grounded RAG assistant for EU credit risk regulation (CRR3, EBA, ECB)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "truststore>=0.10",
]

[project.optional-dependencies]
# Local ingestion / embedding stack (GPU). Not needed by a deployed demo that reads a built index.
ml = [
    "docling>=2.0",
    "sentence-transformers>=3.0",
    "torch>=2.6",
    "torchvision>=0.21",
]
db = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
ui = [
    "streamlit>=1.40",
]
mcp = [
    "mcp>=1.2",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
reglens = "reglens.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
# torchvision must come from the same index as torch, or its compiled ops don't match
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reglens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline HTML/JSON fixtures

[tool.pytest.ini_options]
testpaths = ["tests"]
