# RegLens source registry — every ingested document must be listed here (CLAUDE.md, hard rule 1).
#
# Fields
#   id            stable key used in chunk metadata and citations
#   legal_level   L1 (regulation/directive) | L2 (RTS/ITS) | L3 (EBA guidelines)
#                 | qa (EBA Q&A) | supervisory (ECB guides/instructions)
#   applies_to    SI | LSI | all
#   scope         what part of the document is in the MVP
#   url           null = still to resolve; resolve and verify in Phase 0 before download
#   celex         EUR-Lex CELEX number, fetched via the official CELLAR API
#   short_name    label used in chunk prefixes and citations
#   parts/blocks  PDF part headings, and which parts are in MVP scope
#   search_default false = excluded from default retrieval (still searchable explicitly)
#   articles      optional article filter for the MVP scope (numbers or ranges)
#   consolidated  true = resolve the consolidated version in force on the as-of date
#   Download records (version, date, sha256) live in sources.lock.json.
#   verify        true = identifier, URL or reuse note not yet checked against the official source
#
# Reuse notes are summaries for orientation only — check each site's legal notice before publishing.

eurlex_reuse: &eurlex_reuse >-
  EUR-Lex content may be reused with acknowledgement of the source (Commission Decision 2011/833/EU).
  Only the Official Journal version is authentic; consolidated texts are documentation.
eba_reuse: &eba_reuse >-
  EBA publications: reproduction generally authorised with the source acknowledged — check the EBA legal notice.
ecb_reuse: &ecb_reuse >-
  ECB publications: reproduction generally permitted with the source acknowledged — check the ECB copyright notice.

sources:
  # ---------------------------------------------------------------- Level 1
  - id: crr3-consolidated
    short_name: CRR
    title: Regulation (EU) No 575/2013 (CRR), consolidated version including CRR3 amendments
    issuer: EU (EP & Council)
    legal_level: L1
    reference: CELEX 32013R0575 (base act); consolidated versions CELEX 02013R0575-YYYYMMDD
    celex: 02013R0575
    consolidated: true
    articles: ['4', '92', '107-241', '465', '501']  # MVP scope filter
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32013R0575
    format: html
    applies_to: all
    scope:
      - Art. 4 (definitions)
      - Art. 92 (own funds requirements, output floor)
      - Part Three, Title II, Ch. 2 (Standardised Approach)
      - Part Three, Title II, Ch. 3 (IRB, Art. 142-191)
      - Part Three, Title II, Ch. 4 (Credit risk mitigation)
      - Transitional provisions for the output floor and IRB (Part Ten)
    reuse: *eurlex_reuse
    verify: false  # version resolved at download for the as-of date

